<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" font-family="ui-sans-serif,-apple-system,'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif">
  <defs>
    <linearGradient id="g-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="g-arrow1" gradientUnits="userSpaceOnUse" x1="470" y1="278" x2="509" y2="278">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g-arrow2" gradientUnits="userSpaceOnUse" x1="775" y1="278" x2="809" y2="278">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="g-glow-blue">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-glow-teal">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.10"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#0f172a" fill-opacity="0.035"/>
    </pattern>
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="shadow-sm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="450" fill="#ffffff"/>
  <circle cx="150" cy="40" r="360" fill="url(#g-glow-blue)"/>
  <circle cx="1070" cy="420" r="360" fill="url(#g-glow-teal)"/>
  <rect width="1200" height="450" fill="url(#p-dots)"/>
  <!-- Title -->
  <text x="600" y="53" text-anchor="middle" font-size="36" font-weight="800" fill="#0f172a">Open Pharma Plugins</text>
  <rect x="540" y="66" width="120" height="4" rx="2" fill="url(#g-title)"/>
  <text x="600" y="97" text-anchor="middle" font-size="16" fill="#64748b">Agent Skills + MCP tools for pharmaceutical commercial operations</text>
  <!-- Zone eyebrows -->
  <text x="250" y="132" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#2563eb">CAPABILITIES</text>
  <rect x="236" y="139" width="28" height="3" rx="1.5" fill="#2563eb"/>
  <text x="640" y="132" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#7c3aed">ONE PLUGIN EACH</text>
  <rect x="626" y="139" width="28" height="3" rx="1.5" fill="#8b5cf6"/>
  <text x="977" y="132" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#0d9488">HARNESSES</text>
  <rect x="963" y="139" width="28" height="3" rx="1.5" fill="#14b8a6"/>
  <!-- (1) Capabilities zone -->
  <rect x="40" y="152" width="420" height="252" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6" filter="url(#shadow-lg)"/>
  <!-- hcp-intelligence -->
  <rect x="52" y="164" width="192" height="68" rx="14" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="66" y="179" width="4" height="38" rx="2" fill="#2563eb"/>
  <text x="80" y="195" font-size="14" font-weight="700" fill="#1e293b">hcp-intelligence</text>
  <text x="80" y="215" font-size="10.5" fill="#64748b">profile HCPs from public sources</text>
  <!-- field-training -->
  <rect x="256" y="164" width="192" height="68" rx="14" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="270" y="179" width="4" height="38" rx="2" fill="#8b5cf6"/>
  <text x="284" y="195" font-size="14" font-weight="700" fill="#1e293b">field-training</text>
  <text x="284" y="215" font-size="10.5" fill="#64748b">learning packages from docs</text>
  <!-- territory-alignment -->
  <rect x="52" y="244" width="192" height="68" rx="14" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="66" y="259" width="4" height="38" rx="2" fill="#0d9488"/>
  <text x="80" y="275" font-size="14" font-weight="700" fill="#1e293b">territory-alignment</text>
  <text x="80" y="295" font-size="10.5" fill="#64748b">assign HCPs to reps + maps</text>
  <!-- competitive-intelligence -->
  <rect x="256" y="244" width="192" height="68" rx="14" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="270" y="259" width="4" height="38" rx="2" fill="#f59e0b"/>
  <text x="284" y="275" font-size="13" font-weight="700" fill="#1e293b">competitive-intelligence</text>
  <text x="284" y="295" font-size="10.5" fill="#64748b">trials, FDA, news, CI briefs</text>
  <!-- next-best-engagement -->
  <rect x="52" y="324" width="192" height="68" rx="14" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="66" y="339" width="4" height="38" rx="2" fill="#ec4899"/>
  <text x="80" y="355" font-size="13" font-weight="700" fill="#1e293b">next-best-engagement</text>
  <text x="80" y="375" font-size="10.5" fill="#64748b">score HCPs, plan actions</text>
  <!-- campaign-studio -->
  <rect x="256" y="324" width="192" height="68" rx="14" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="270" y="339" width="4" height="38" rx="2" fill="#ef4444"/>
  <text x="284" y="355" font-size="14" font-weight="700" fill="#1e293b">campaign-studio</text>
  <text x="284" y="375" font-size="10.5" fill="#64748b">briefs, copy, asset rendering</text>
  <!-- arrow (1)->(2) -->
  <text x="485" y="264" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.5" fill="#7c3aed">ship as</text>
  <line x1="470" y1="278" x2="500" y2="278" stroke="url(#g-arrow1)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M500 272.5 L509 278 L500 283.5 Z" fill="#7c3aed"/>
  <!-- (2) Plugin -->
  <rect x="510" y="152" width="260" height="252" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.6" filter="url(#shadow-lg)"/>
  <rect x="534" y="169" width="212" height="28" rx="14" fill="#f5f3ff" stroke="#ede9fe" stroke-width="1"/>
  <text x="640" y="189" text-anchor="middle" font-size="15" font-weight="700" font-family="ui-monospace,'SFMono-Regular','Menlo','Consolas',monospace" fill="#6d28d9">open-pharma-plugins-*</text>
  <text x="640" y="212" text-anchor="middle" font-size="11.5" fill="#8b5cf6">install only what you need</text>
  <!-- plugin card deck -->
  <rect x="556" y="234" width="168" height="100" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
  <rect x="544" y="243" width="192" height="106" rx="11" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.2"/>
  <rect x="532" y="252" width="216" height="116" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4" filter="url(#shadow-sm)"/>
  <!-- anatomy chips: Skill + MCP server -->
  <rect x="544" y="268" width="62" height="30" rx="15" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.4"/>
  <text x="575" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Skill</text>
  <text x="616" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#c4b5fd">+</text>
  <rect x="626" y="268" width="110" height="30" rx="15" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.4"/>
  <text x="681" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">MCP server</text>
  <text x="575" y="316" text-anchor="middle" font-size="9.5" fill="#94a3b8">the brains</text>
  <text x="681" y="316" text-anchor="middle" font-size="9.5" fill="#94a3b8">the hands</text>
  <line x1="552" y1="330" x2="728" y2="330" stroke="#f1f5f9" stroke-width="1.2"/>
  <text x="640" y="351" text-anchor="middle" font-size="10.5" fill="#94a3b8">launched on demand by uvx</text>
  <text x="640" y="390" text-anchor="middle" font-size="10" fill="#c4b5fd">one card per capability</text>
  <!-- arrow (2)->(3) -->
  <text x="790" y="264" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.5" fill="#0d9488">install</text>
  <line x1="775" y1="278" x2="800" y2="278" stroke="url(#g-arrow2)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M800 272.5 L809 278 L800 283.5 Z" fill="#0d9488"/>
  <!-- (3) Harness -->
  <rect x="810" y="152" width="334" height="252" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="1.6" filter="url(#shadow-lg)"/>
  <!-- Claude Code -->
  <rect x="842" y="164" width="280" height="48" rx="12" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="856" y="175" width="4" height="26" rx="2" fill="#2563eb"/>
  <text x="872" y="187" font-size="16" font-weight="700" fill="#1e293b">Claude Code</text>
  <text x="872" y="202" font-size="9.5" fill="#64748b">CLI, desktop app, IDE extensions</text>
  <!-- Codex -->
  <rect x="842" y="224" width="280" height="48" rx="12" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="856" y="235" width="4" height="26" rx="2" fill="#0d9488"/>
  <text x="872" y="247" font-size="16" font-weight="700" fill="#1e293b">Codex</text>
  <text x="872" y="262" font-size="9.5" fill="#64748b">CLI, desktop app, cloud agents</text>
  <!-- GitHub Copilot -->
  <rect x="842" y="284" width="280" height="48" rx="12" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="856" y="295" width="4" height="26" rx="2" fill="#8b5cf6"/>
  <text x="872" y="307" font-size="16" font-weight="700" fill="#1e293b">GitHub Copilot</text>
  <text x="872" y="322" font-size="9.5" fill="#64748b">Copilot CLI plugin marketplace</text>
  <!-- Direct MCP -->
  <rect x="842" y="344" width="280" height="48" rx="12" fill="#ffffff" stroke="#e6e9ef" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="856" y="355" width="4" height="26" rx="2" fill="#94a3b8"/>
  <text x="872" y="367" font-size="16" font-weight="700" fill="#1e293b">Direct MCP</text>
  <text x="872" y="382" font-size="9.5" fill="#64748b">any MCP-compatible agent</text>
  <!-- Footer -->
  <text x="600" y="434" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan font-family="ui-monospace,'SFMono-Regular','Menlo','Consolas',monospace">github.com/PharmaGenAI/open-pharma-plugins</tspan><tspan>&#160;&#160;·&#160;&#160;Apache-2.0</tspan></text>
</svg>
